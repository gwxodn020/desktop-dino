name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    strategy:
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg libarchive-tools

      - run: npm run build

      - name: Build
        run: npx electron-builder --publish never

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.pacman
            dist/*.blockmap
            dist/latest*.yml

      - uses: actions/upload-artifact@v4
        with:
          name: trexpet-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.pacman
            dist/*.pkg.tar.zst
